# ============================================================================
#  FILE BARU — milik aplikasi API (mapu/api-kendaraan/)
#  Letakkan : mapu/api-kendaraan/docker-compose.yml
#
#  Container API berjalan TERPISAH dari container mapu, tetapi BERGABUNG ke
#  network milik mapu agar bisa menjangkau database (mapu-db / alias "db").
#  File docker-compose.yml milik mapu TIDAK disentuh.
#
#  Prasyarat: container mapu-db sudah jalan
#             (dari folder mapu:  docker-compose up -d db)
# ============================================================================

services:
  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mapu-apikendaraan-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
      - api-writable:/var/www/html/writable
    networks:
      - mapu-net

  api-web:
    image: nginx:1.27-alpine
    container_name: mapu-apikendaraan-nginx
    restart: unless-stopped
    ports:
      # Port 8081 di host → 80 di container (mapu tetap memakai 8080)
      - "8081:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-app
    networks:
      - mapu-net

networks:
  # Bergabung ke network yang SUDAH DIBUAT oleh docker-compose milik mapu.
  # Verifikasi namanya dengan:  docker network ls | grep mapu
  mapu-net:
    external: true
    name: mapu_mapu-network

volumes:
  api-writable:
