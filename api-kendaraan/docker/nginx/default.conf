# ============================================================================
#  FILE BARU — milik aplikasi API (mapu/api/)
#  Letakkan : mapu/api/docker/nginx/default.conf
#  Konfigurasi nginx untuk aplikasi API (meneruskan PHP ke container api-app).
# ============================================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "api-app" = nama service PHP-FPM di docker-compose.yml
        fastcgi_pass api-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Teruskan header Authorization agar bearer token sampai ke PHP
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
